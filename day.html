<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>جدول اليوم — ترتيبات الحج</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="phone-wrap">

  <div class="page-title" id="dayHead" style="margin-top:8px;"></div>

  <div id="eventsList"></div>

  <a class="btn-back" href="schedule.html">رجوع</a>
</div>

<script src="assets/main.js"></script>
<script>
(async function () {
  const listEl = document.getElementById('eventsList');
  const headEl = document.getElementById('dayHead');
  const dayId = new URLSearchParams(location.search).get('day');

  try {
    const days = await loadCSV('data/schedule/days.csv');
    const day = days.find(d => d.id === dayId) || days[0];
    if (!day) throw new Error('لا توجد أيام معرّفة');

    const color = dayColor(day['لون']);
    headEl.innerHTML = '';
    headEl.appendChild(el('div', {
      style: 'display:inline-block;color:#fff;padding:8px 22px;border-radius:999px;font-weight:800;font-size:1.05rem;background:' + color
    }, day['اسم_اليوم']));
    headEl.appendChild(el('div', { class: 'sub', style: 'margin-top:8px;' },
      (day['اليوم_بالاسبوع'] || '') + '  ' + (day['التاريخ_الهجري'] || '') + ' الموافق ' + (day['التاريخ_الميلادي'] || '')));

    const rows = await loadCSV('data/schedule/' + day.id + '.csv');
    listEl.innerHTML = '';
    if (!rows.length) {
      listEl.appendChild(el('div', { class: 'empty-state' }, 'لا توجد فعاليات مضافة لهذا اليوم بعد.'));
      return;
    }

    const catIcon = { move: 'move', gather: 'gather', prayer: 'prayer', meal: 'meal', stay: 'stay', arrive: 'arrive' };
    rows.forEach(r => {
      const cat = (r['التصنيف'] || '').trim();
      const parts = [];
      if (r['الوقت']) {
        parts.push(el('div', { class: 'time-pill', style: 'background:' + color }, 'الساعة ' + r['الوقت']));
      }
      const circClass = cat === 'move' ? 'icon-circ cat-move' : cat === 'gather' ? 'icon-circ cat-gather' : 'icon-circ';
      const circStyle = (cat === 'move' || cat === 'gather') ? '' : 'style="background:' + color + '"';
      const iconCirc = el('span', { class: circClass, html: icon(catIcon[cat] || 'clock') });
      if (circStyle) iconCirc.setAttribute('style', 'background:' + color);

      const txtChildren = [el('div', { class: 'etitle' }, r['الفعالية'] || '')];
      if (r['ملاحظات']) txtChildren.push(el('div', { class: 'enote' }, r['ملاحظات']));

      const bodyChildren = [iconCirc, el('div', { class: 'txt' }, txtChildren)];
      if (r['رابط_الموقع']) {
        bodyChildren.push(el('a', { class: 'loc-link', href: r['رابط_الموقع'], target: '_blank', rel: 'noopener', title: r['اسم_الموقع'] || 'الموقع', html: icon('pin') }));
      }
      parts.push(el('div', { class: 'body' }, bodyChildren));
      listEl.appendChild(el('div', { class: 'event' }, parts));
    });
  } catch (e) {
    showError(listEl, e.message);
  }
})();
</script>
</body>
</html>
