<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>أوقات الصلاة — ترتيبات الحج</title>
<link rel="stylesheet" href="assets/style.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/data-store.js"></script>
</head>
<body>
<div class="phone-wrap">

  <div class="emblem-head">
    <div class="logo-slot">
      <img src="assets/logo.png" alt="شعار الجهة" onerror="this.onerror=null;this.src='assets/logo-placeholder.svg';">
    </div>
  </div>

  <div class="page-title" style="margin-top:8px;">
    <h1 id="titleTop"></h1>
  </div>

  <div class="page-title" id="dayBadgeWrap" style="margin-bottom:20px;"></div>

  <div id="prayerList"></div>

  <a class="btn-back" href="schedule.html">رجوع</a>
</div>

<script src="assets/main.js"></script>
<script>
(async function () {
  const listEl = document.getElementById('prayerList');
  const dayId = new URLSearchParams(location.search).get('day');

  try {
    const data = await loadData();
    if (!data) throw new Error('ما فيه بيانات منشورة بعد');
    document.getElementById('titleTop').textContent =
      'أوقات الصلاة في مكة المكرمة\n' + (data.home.year || '');
    document.getElementById('titleTop').style.whiteSpace = 'pre-line';

    const days = data.days || [];
    const day = days.find(d => d.id === dayId) || days[0];
    if (!day) throw new Error('لا توجد أيام معرّفة');
    const color = dayColor(day.color);

    const badgeWrap = document.getElementById('dayBadgeWrap');
    badgeWrap.innerHTML = '';
    badgeWrap.appendChild(el('div', {
      style: 'display:inline-block;color:#fff;padding:8px 22px;border-radius:999px;font-weight:800;font-size:1.05rem;background:' + color
    }, day.name));
    badgeWrap.appendChild(el('div', { class: 'sub', style: 'margin-top:8px;' },
      (day.weekday || '') + '  ' + (day.hijri || '') + ' الموافق ' + (day.gregorian || '')));

    listEl.innerHTML = '';
    const order = ['الفجر', 'الظهر', 'العصر', 'المغرب', 'العشاء'];
    const prayers = day.prayers || {};
    let any = false;
    order.forEach(name => {
      if (!prayers[name]) return;
      any = true;
      listEl.appendChild(el('div', { class: 'prayer-row' }, [
        el('span', { class: 'kaaba', style: 'background:' + color, html: icon('prayer') }),
        el('div', { class: 'p-time' }, [
          el('div', {}, 'الساعة ' + prayers[name]),
        ]),
        el('div', { class: 'p-name' }, 'صلاة ' + name),
      ]));
    });
    if (!any) listEl.appendChild(el('div', { class: 'empty-state' }, 'لم تُضف أوقات الصلاة لهذا اليوم بعد.'));
  } catch (e) {
    showError(listEl, e.message);
  }
})();
</script>
</body>
</html>
